version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Expo-managed packages only move together, with `npx expo install --fix` during an
  # SDK upgrade, so Dependabot leaves them alone.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: 'jest-expo'
      - dependency-name: 'eslint-config-expo'
      - dependency-name: '@types/react'
      - dependency-name: 'typescript'
    groups:
      javascript:
        patterns: ['*']

  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
