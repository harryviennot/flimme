# A merged migration or server change reaches staging with no hands (roadmap M1.15, M2.12). The
# API and the app join with M8.4: the order is database, server and API, then app.
# Needs the `staging` GitHub environment: docs/architecture/operations.md#continuous-integration.
name: Staging

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'server/**', 'mobile/**', 'packages/**', 'pnpm-lock.yaml']
  workflow_dispatch:

permissions:
  contents: read

# Two merges close together deploy one after the other, never over each other.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  database:
    # A manual run from a branch must not push that branch's unmerged migrations.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          # Pinned with mise.toml and ci.yml.
          version: 2.122.0
      - name: Link to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply the new migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
      - name: List migrations (informational, never fails on a mismatch)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Smoke test the Data API (only api exposed, GraphQL off)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/smoke-data-api.mjs

  server:
    needs: database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WORKERS }}
      FLY_APP: flimme-workers-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A migration-only merge leaves the worker alone: a new image label would replace the machine.
      # A manual run always deploys.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changed
        with:
          filters: |
            server:
              - 'server/**'
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      # The worker cannot start without its database login. Until Harry has set the Fly secrets,
      # skip the deploy (the job stays green; the app itself must exist) instead of shipping a worker that crashes in a loop.
      - name: Check the app has its secrets
        id: ready
        run: |
          secrets="$(flyctl secrets list --app "$FLY_APP")"
          if grep -qw PIPELINE_DATABASE_URL <<< "$secrets"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$FLY_APP has no PIPELINE_DATABASE_URL secret yet, so the deploy is skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the pipeline worker
        if: steps.ready.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || steps.changed.outputs.server == 'true')
        working-directory: server
        # One machine, never two (a second pipeline worker would only double the TMDB traffic).
        run: flyctl deploy --config fly.workers.staging.toml --remote-only --ha=false --image-label "sha-$GITHUB_SHA"

  api:
    needs: database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API }}
      FLY_APP: flimme-api-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changed
        with:
          filters: |
            server:
              - 'server/**'
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      # Harry creates the app, its deploy token and its secrets (operations.md). Until all three
      # exist the job skips with a warning and stays green. Secret names only are printed.
      - name: Check the app exists and has its secrets
        id: ready
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::No FLY_API_TOKEN_API secret yet, so the API deploy is skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! secrets="$(flyctl secrets list --app "$FLY_APP" 2>/dev/null)"; then
            echo "::warning::The Fly app $FLY_APP does not exist yet (or the token cannot see it), so the API deploy is skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qw API_DATABASE_URL <<< "$secrets" && grep -qw SUPABASE_URL <<< "$secrets"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$FLY_APP is missing API_DATABASE_URL or SUPABASE_URL, so the deploy is skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the API
        if: steps.ready.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || steps.changed.outputs.server == 'true')
        working-directory: server
        run: flyctl deploy --config fly.api.staging.toml --remote-only --ha=false --image-label "sha-$GITHUB_SHA"

  app:
    # Database, then server, then app (operations.md#releasing). A JavaScript-only change reaches
    # the preview builds as an EAS Update; a changed native fingerprint gets no automatic build
    # (the free plan has 15 per platform a month): the job summary says to run "Preview build".
    needs: [database, server, api]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # The build and its updates must see the same value: the app config counts in the fingerprint.
      APP_VARIANT: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global eas-cli@27.2.0
      - name: Does a preview build carry this commit's native fingerprint?
        id: plan
        run: node tools/preview-update-plan.mjs
      - name: Publish the update to the preview channel
        if: steps.plan.outputs.platform != 'none'
        working-directory: mobile
        env:
          PLATFORM: ${{ steps.plan.outputs.platform }}
        run: eas update --channel preview --environment preview --platform "$PLATFORM" --input-dir dist --message "$GITHUB_SHA" --non-interactive
      # The update's bundle stays in mobile/dist. Until Harry adds SENTRY_AUTH_TOKEN the step is skipped with a warning.
      - name: Upload the update's source maps to Sentry
        if: steps.plan.outputs.platform != 'none'
        working-directory: mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::No SENTRY_AUTH_TOKEN secret yet, so the update's source maps were not uploaded"
          else
            pnpm exec sentry-expo-upload-sourcemaps dist
          fi
