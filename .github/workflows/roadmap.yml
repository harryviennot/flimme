# After a merge, ticks the roadmap task named in the pull request title, so parallel
# pull requests don't all edit roadmap.md. It pushes with a deploy key
# (ROADMAP_DEPLOY_KEY): a personal repository can't put GitHub Actions in the main
# ruleset's bypass list, but it can put deploy keys (docs/pipeline.md#one-time-setup).
name: Roadmap

on:
  pull_request:
    types: [closed]
    branches: [main]

# The push uses the deploy key, so the job's own token only needs to read.
permissions:
  contents: read

jobs:
  tick:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          ssh-key: ${{ secrets.ROADMAP_DEPLOY_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # The tick script needs no packages, and pnpm isn't set up in this job.
          package-manager-cache: false
      - name: Tick the task
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node tools/roadmap-tick.mjs --title "$TITLE"
      - name: Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Tick the roadmap for: $TITLE"
          # Another merge may have landed since the checkout.
          git pull --rebase --quiet origin main
          git push
