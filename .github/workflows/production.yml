# Production by hand, after checking staging (roadmap M1.15). Harry runs this workflow, and the
# `production` environment's required approval holds the job until he approves it.
# The pipeline worker joins with M2.12 and the API with M8.4, the app later: the order is database, server and API, then app.
# The invite page on flimme.com (web, M4.18) comes last.
# Needs the `production` GitHub environment: docs/architecture/operations.md#continuous-integration.
name: Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  database:
    # Only main's migrations go to production, never a branch's.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          # Pinned with mise.toml and ci.yml.
          version: 2.122.0
      - name: Link to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply the new migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
      - name: List migrations (informational, never fails on a mismatch)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Smoke test the Data API (only api exposed, GraphQL off)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/smoke-data-api.mjs

  server:
    needs: database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WORKERS }}
      FLY_APP: flimme-workers-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      # The worker cannot start without its database login. Until Harry has set the Fly secrets,
      # skip the deploy (the job stays green; the app itself must exist) instead of shipping a worker that crashes in a loop.
      - name: Check the app has its secrets
        id: ready
        run: |
          secrets="$(flyctl secrets list --app "$FLY_APP")"
          if grep -qw PIPELINE_DATABASE_URL <<< "$secrets"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$FLY_APP has no PIPELINE_DATABASE_URL secret yet, so the deploy is skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the pipeline worker
        if: steps.ready.outputs.ready == 'true'
        working-directory: server
        # One machine, never two (a second pipeline worker would only double the TMDB traffic).
        run: flyctl deploy --config fly.workers.production.toml --remote-only --ha=false --image-label "sha-$GITHUB_SHA"

  api:
    needs: database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API }}
      FLY_APP: flimme-api-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      # Harry creates the app, its deploy token and its secrets (operations.md). Until all three
      # exist the job skips with a warning and stays green. Secret names only are printed.
      - name: Check the app exists and has its secrets
        id: ready
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::No FLY_API_TOKEN_API secret yet, so the API deploy is skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! secrets="$(flyctl secrets list --app "$FLY_APP" 2>/dev/null)"; then
            echo "::warning::The Fly app $FLY_APP does not exist yet (or the token cannot see it), so the API deploy is skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qw API_DATABASE_URL <<< "$secrets" && grep -qw SUPABASE_URL <<< "$secrets"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$FLY_APP is missing API_DATABASE_URL or SUPABASE_URL, so the deploy is skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the API
        if: steps.ready.outputs.ready == 'true'
        working-directory: server
        run: flyctl deploy --config fly.api.production.toml --remote-only --image-label "sha-$GITHUB_SHA"

  web:
    # The invite page and the app-link files on flimme.com (roadmap M4.18). Dokploy on Harry's VPS
    # builds mobile/web.Dockerfile from main and swaps the container (Q18.4, Q18.6); its own
    # auto-deploy stays off. Needs, in the `production` environment, the DOKPLOY_API_KEY secret and
    # the DOKPLOY_URL (the panel's https address) and DOKPLOY_APPLICATION_ID variables
    # (groundwork.md#secrets).
    needs: [server, api]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
      DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
    steps:
      - name: Check the secret and the variables are set
        run: |
          missing=()
          [ -n "$DOKPLOY_API_KEY" ] || missing+=("the secret DOKPLOY_API_KEY")
          [ -n "$DOKPLOY_URL" ] || missing+=("the variable DOKPLOY_URL")
          [ -n "$DOKPLOY_APPLICATION_ID" ] || missing+=("the variable DOKPLOY_APPLICATION_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::The production environment lacks ${missing[*]} (groundwork.md#secrets)."
            exit 1
          fi
          case "$DOKPLOY_URL" in
            https://*) ;;
            *) echo "::error::DOKPLOY_URL must be the panel's https:// address."; exit 1 ;;
          esac
      - name: Ask Dokploy to deploy
        run: |
          body="$(jq -n --arg id "$DOKPLOY_APPLICATION_ID" '{applicationId: $id}')"
          status="$(curl -sS --max-time 60 -o "$RUNNER_TEMP/dokploy.txt" -w '%{http_code}' \
            -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
            --data "$body" || true)"
          if [ "${status:0:1}" != 2 ]; then
            echo "::error::Dokploy answered ${status:-nothing} to application.deploy."
            head -c 500 "$RUNNER_TEMP/dokploy.txt" 2>/dev/null || true
            exit 1
          fi
          echo "Dokploy accepted the deploy ($status)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # Dokploy builds on the VPS after answering, and swaps the container when the build is done,
      # so a failing check is retried. The deploy call only queues the build: a check that passes
      # early may still be the previous container; Dokploy's Deployments tab shows the build itself.
      - name: Check flimme.com (retried for up to 10 minutes)
        run: |
          deadline=$((SECONDS + 600))
          until node tools/check-well-known.mjs https://flimme.com; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::https://flimme.com still fails the check after 10 minutes."
              exit 1
            fi
            sleep 30
          done
