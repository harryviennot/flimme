# Production by hand, after checking staging (roadmap M1.15). Harry runs this workflow, and the
# `production` environment's required approval holds the job until he approves it.
# The pipeline worker joins with M2.12 and the API with M8.4, the app later: the order is database, server and API, then app.
# Needs the `production` GitHub environment: docs/architecture/operations.md#continuous-integration.
name: Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  database:
    # Only main's migrations go to production, never a branch's.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          # Pinned with mise.toml and ci.yml.
          version: 2.122.0
      - name: Link to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply the new migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
      - name: List migrations (informational, never fails on a mismatch)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Smoke test the Data API (only api exposed, GraphQL off)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/smoke-data-api.mjs

  server:
    needs: database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WORKERS }}
      FLY_APP: flimme-workers-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # v1.5
      # The worker cannot start without its database login. Until Harry has set the Fly secrets,
      # skip the deploy (the job stays green; the app itself must exist) instead of shipping a worker that crashes in a loop.
      - name: Check the app has its secrets
        id: ready
        run: |
          secrets="$(flyctl secrets list --app "$FLY_APP")"
          if grep -qw PIPELINE_DATABASE_URL <<< "$secrets"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$FLY_APP has no PIPELINE_DATABASE_URL secret yet, so the deploy is skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the pipeline worker
        if: steps.ready.outputs.ready == 'true'
        working-directory: server
        # One machine, never two (a second pipeline worker would only double the TMDB traffic).
        run: flyctl deploy --config fly.workers.production.toml --remote-only --ha=false --image-label "sha-$GITHUB_SHA"

  api:
    needs: database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API }}
      FLY_APP: flimme-api-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # v1.5
      # Harry creates the app, its deploy token and its secrets (operations.md). Until all three
      # exist the job skips with a warning and stays green. Secret names only are printed.
      - name: Check the app exists and has its secrets
        id: ready
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::No FLY_API_TOKEN_API secret yet, so the API deploy is skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! secrets="$(flyctl secrets list --app "$FLY_APP" 2>/dev/null)"; then
            echo "::warning::The Fly app $FLY_APP does not exist yet (or the token cannot see it), so the API deploy is skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qw API_DATABASE_URL <<< "$secrets" && grep -qw SUPABASE_URL <<< "$secrets"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$FLY_APP is missing API_DATABASE_URL or SUPABASE_URL, so the deploy is skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the API
        if: steps.ready.outputs.ready == 'true'
        working-directory: server
        run: flyctl deploy --config fly.api.production.toml --remote-only --image-label "sha-$GITHUB_SHA"
