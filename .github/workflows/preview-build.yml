# A preview build of the app, started by hand (roadmap M3.3). The build runs on Expo's machines
# (EAS), not on this runner, and the free plan allows 15 builds per platform a month, so nothing
# starts one automatically: staging.yml publishes an update when the native fingerprint still
# matches a build, and says here to run this when it doesn't.
# Needs the EXPO_TOKEN repository secret: docs/architecture/operations.md#continuous-integration.
name: Preview build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build
        type: choice
        options: [all, ios, android]
        default: all

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PLATFORM: ${{ inputs.platform }}
      # Same value as the updates, because the app config counts in the fingerprint.
      APP_VARIANT: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # EAS reads the app config, which needs the project's packages.
      - run: pnpm install --frozen-lockfile
      - run: npm install --global eas-cli@27.2.0
      # --no-wait: the build runs on EAS; this job ends once it is queued.
      - name: Start the build on EAS
        working-directory: mobile
        run: eas build --profile preview --platform "$PLATFORM" --non-interactive --no-wait
