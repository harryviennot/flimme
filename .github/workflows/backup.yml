# The weekly logical dump (roadmap M9.6): roles, schema and data, encrypted with age before they
# leave the runner, kept 28 days in a private Tigris bucket. Never an artifact: the repository is public.
# Needs variables BACKUP_AGE_RECIPIENT and BACKUP_BUCKET and secrets BACKUP_S3_ACCESS_KEY_ID and
# BACKUP_S3_SECRET_ACCESS_KEY in the environment: docs/architecture/operations.md#backups-and-restore.
name: Backup

on:
  schedule:
    - cron: '30 3 * * 0' # Sunday, 03:30 UTC
  workflow_dispatch:
    inputs:
      environment:
        description: Which project to dump
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

concurrency:
  group: backup-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    env:
      BACKUP_ENV: ${{ inputs.environment || 'production' }}
    steps:
      # Until Harry has made the bucket and the key pair (step H5), end green with a warning.
      - name: Check the backup settings exist
        id: ready
        env:
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BUCKET: ${{ vars.BACKUP_BUCKET }}
          S3_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          S3_SECRET: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          missing=''
          [ -n "$AGE_RECIPIENT" ] || missing="$missing BACKUP_AGE_RECIPIENT(variable)"
          [ -n "$BUCKET" ] || missing="$missing BACKUP_BUCKET(variable)"
          [ -n "$S3_KEY_ID" ] || missing="$missing BACKUP_S3_ACCESS_KEY_ID"
          [ -n "$S3_SECRET" ] || missing="$missing BACKUP_S3_SECRET_ACCESS_KEY"
          [ -n "$DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "$ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$PROJECT_ID" ] || missing="$missing SUPABASE_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::No backup was made for $BACKUP_ENV, these settings are missing in the $BACKUP_ENV environment:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.ready == 'true'
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        if: steps.ready.outputs.ready == 'true'
        with:
          # Pinned with mise.toml and ci.yml.
          version: 2.122.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install age
        if: steps.ready.outputs.ready == 'true'
        run: sudo apt-get install -y --no-install-recommends age > /dev/null
      - name: Link to the project
        if: steps.ready.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      # Roles, schema, then data with COPY, as Supabase's guide for moving a project does. The
      # plain files stay in the runner's temp folder and are removed once encrypted.
      - name: Dump and encrypt
        if: steps.ready.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          set +x
          out="$RUNNER_TEMP/dump"
          mkdir -p "$out"
          supabase db dump --linked --role-only -f "$out/roles.sql"
          supabase db dump --linked -f "$out/schema.sql"
          supabase db dump --linked --data-only --use-copy -f "$out/data.sql"
          # A dump without the players is not a backup.
          grep -q '^COPY "auth"."users"' "$out/data.sql" || { echo "::error::The data dump has no auth.users"; exit 1; }
          grep -q '^COPY "public"."profiles"' "$out/data.sql" || { echo "::error::The data dump has no public.profiles"; exit 1; }
          for part in roles schema data; do
            age --recipient "$AGE_RECIPIENT" --output "$out/$part.sql.age" "$out/$part.sql"
            rm -f "$out/$part.sql"
            [ -s "$out/$part.sql.age" ] || { echo "::error::$part.sql.age is empty"; exit 1; }
          done
          ls -l "$out" | awk '{print $5, $9}'
      - name: Upload to the private bucket
        if: steps.ready.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://fly.storage.tigris.dev
          BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          day=$(date -u +%F)
          for part in roles schema data; do
            aws s3 cp "$RUNNER_TEMP/dump/$part.sql.age" "s3://$BUCKET/$BACKUP_ENV/$day/$part.sql.age" --only-show-errors
          done
          echo "Uploaded $BACKUP_ENV/$day/{roles,schema,data}.sql.age"
      # Only after a successful upload, so a failing week never leaves the bucket empty.
      - name: Delete dumps older than 28 days
        if: steps.ready.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://fly.storage.tigris.dev
          BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 ls "s3://$BUCKET/$BACKUP_ENV/" --recursive | awk '{print $4}' > "$RUNNER_TEMP/keys.txt"
          node tools/backup-retention.mjs "$BACKUP_ENV" < "$RUNNER_TEMP/keys.txt" > "$RUNNER_TEMP/expired.txt"
          while read -r key; do
            aws s3 rm "s3://$BUCKET/$key" --only-show-errors
            echo "Deleted $key"
          done < "$RUNNER_TEMP/expired.txt"
      - name: Remove the dump from the runner
        if: always() && steps.ready.outputs.ready == 'true'
        run: rm -rf "$RUNNER_TEMP/dump"
