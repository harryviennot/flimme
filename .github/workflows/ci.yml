# Every pull request: only the parts that changed are checked, so a docs-only or app-only
# change doesn't start the database. See docs/architecture/groundwork.md#ci-and-repository-settings.
# Every action is pinned to a commit SHA with a version comment (the `workflows` job checks it);
# Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    # paths-filter lists the pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      server: ${{ steps.filter.outputs.server }}
      database: ${{ steps.filter.outputs.database }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A change to CI itself runs every job, so an action update is tested where it's used.
          filters: |
            mobile:
              - 'mobile/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/**'
            server:
              - 'server/**'
              - '.github/workflows/**'
            database:
              - 'supabase/**'
              - 'packages/contract/**'
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - '.github/workflows/**'

  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: The title starts with a task id (or says what kind of change it is)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(M[0-9]+\.[0-9]+|Docs|Chore|Fix|Bootstrap)\b'; then
            echo "Start the title with the roadmap task id, e.g. \"M4.8 Join with a code\"."
            exit 1
          fi

  workflows:
    # Cheap, so it always runs: the CI tools' own tests, and every action pinned to a commit SHA.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test tools/*.test.mjs
      - name: Every action is pinned to a commit SHA
        run: node tools/check-ci.mjs pins

  migration-order:
    # supabase db push refuses a local migration older than one already applied, so an
    # out-of-order file would stop the staging deploy. Catch it here instead.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: New migrations sort after every migration on main
        env:
          BASE: origin/${{ github.base_ref }}
        run: node tools/check-ci.mjs migration-order "$BASE"

  secrets:
    runs-on: ubuntu-latest
    # gitleaks lists the pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versions match the Expo SDK
        run: pnpm --filter mobile exec expo install --check
      - name: Tokens, translations, gallery, lint, types, tests
        run: pnpm --filter mobile run check
      - name: Contract types
        run: pnpm --filter @flimme/contract run typecheck

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
      - name: The image builds and prints its help
        run: |
          docker build --tag flimme-server .
          docker run --rm flimme-server --help

  server-contract:
    # The server's contract tests (server/tests/contract) against the real schema on the local
    # stack, logged in as the real server logins. They run when the server or the database
    # changes, because either can break the other. Cloud sessions run them on the lite database.
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          # Pinned with mise.toml: the same version as the database job.
          version: 2.122.0
      - name: Start only the services the tests need
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,supavisor
      - run: supabase db reset
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --frozen
        working-directory: server
      - name: Contract tests (a missing database fails them instead of skipping)
        run: uv run pytest tests/contract -q
        working-directory: server
        env:
          REQUIRE_DATABASE: '1'
          CONTRACT_ADMIN_DATABASE_URL: postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres

  database-lite:
    # The migrations tested on plain Postgres 16 with stand-ins for Supabase's schemas,
    # like cloud sessions do. The real stack is the `database` job below.
    needs: changes
    if: needs.changes.outputs.database == 'true'
    # Pinned: ubuntu-latest became 26.04 in October 2026, which doesn't package Postgres 16.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Postgres 16 with pgTAP and pgvector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16-pgtap postgresql-16-pgvector libtap-parser-sourcehandler-pgtap-perl
          sudo systemctl start postgresql
          sudo -u postgres createuser --superuser "$USER"
      - run: bash supabase/lite/load.sh
        env:
          PGDATABASE: postgres
      - run: bash supabase/lite/test.sh

  database:
    # The real local stack: supabase db reset builds from supabase/migrations alone
    # (the baseline migration, M1.5) and supabase test db runs every pgTAP file,
    # stack-only ones included. The deploy workflows are staging.yml and production.yml.
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          # Pinned with mise.toml: the generated api types depend on the CLI version.
          version: 2.122.0
      - name: Start only the services the tests need
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,supavisor
      - run: supabase db reset
      - run: supabase test db
      - name: New migrations are safe (Squawk)
        # Pinned with tools/check.mjs, so the pre-push hook and CI lint the same way.
        run: |
          changed=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref || 'main' }}... -- 'supabase/migrations/*.sql')
          if [ -n "$changed" ]; then npx --yes squawk-cli@2.70.0 $changed; fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Generated types are up to date
        id: typegen
        run: |
          pnpm install --frozen-lockfile
          node tools/typegen.mjs --check
      - name: Show the generated types when they are stale
        if: failure() && steps.typegen.outcome == 'failure'
        run: |
          node tools/typegen.mjs || true
          git diff --stat -- packages/contract/src/database.types.ts
          git diff -- packages/contract/src/database.types.ts | head -400
      - name: Upload the generated types when they are stale
        if: failure() && steps.typegen.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database.types.ts
          path: packages/contract/src/database.types.ts
          if-no-files-found: ignore

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Nothing to install, and pnpm isn't set up in this job.
          package-manager-cache: false
      - run: node tools/check-links.mjs
