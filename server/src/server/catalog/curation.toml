# The United Kingdom's services (M24.6; Harry chose them on 9 Nov 2026). Checked on TMDB's GB
# provider list that day, with each service's offer kinds read from the GB watch providers of
# its most popular films. Prime Video is 9 here, not France's 119. Listed in TMDB's GB display
# order (no override), so NOW and HBO Max come last. BBC iPlayer is listed, not free, although
# TMDB lists it only as free: watching it needs a TV licence. ITVX Premium and Channel 4 Plus
# are left out, since their free versions count for every room; Curzon Home Cinema is rentals
# only. The free services are ad-supported only on TMDB (one stray subscription offer in 100
# films for Channel 4 and for 5); W4free and JustWatch TV Free are left out.
[services.GB]
listed = [
  8,    # Netflix
  9,    # Amazon Prime Video
  350,  # Apple TV
  337,  # Disney Plus
  283,  # Crunchyroll
  531,  # Paramount Plus
  29,   # Sky Go
  38,   # BBC iPlayer
  11,   # MUBI
  224,  # BFI Player
  99,   # Shudder
  591,  # Now TV Cinema (NOW's films)
  1899, # HBO Max
]
free = [
  41,   # ITVX
  103,  # Channel 4
  333,  # 5
  73,   # Tubi TV
  300,  # Pluto TV
  538,  # Plex
