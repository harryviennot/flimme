# Our curation of the reference tables (see curation.py for the format). Ids and flags only.
# The reference job applies it every week, in every environment.

[countries.FR]
enabled = true
language = "fr"

# The United Kingdom, early, for friends and family testers (M24.6, Harry, 9 Nov 2026). The
# stores still list France only.
[countries.GB]
enabled = true
language = "en"

# France: U is 0, the numbers are themselves.
[certification_ages.FR]
U = 0
"10" = 10
"12" = 12
"16" = 16
"18" = 18

# United Kingdom (BBFC): PG at 8, the BBFC's own guidance ("should not unsettle a child aged
# around eight or older"). 12A and 12 are 12. R18 is left out: it has no age, so a room with an
# age cap leaves the film out, and adult titles never reach a deck anyway.
[certification_ages.GB]
U = 0
PG = 8
12A = 12
"12" = 12
"15" = 15
"18" = 18

# United States: PG at 7 is the doc's placeholder (tmdb.md#certifications-and-age). Used for
# films with no certification in an enabled country. Anything else has no age.
[certification_ages.US]
G = 0
PG = 7
PG-13 = 13
R = 17
NC-17 = 18

# France's services (M2.6; Harry signs the list off, Q34). TMDB provider ids only: names are
# comments. Listed means shown in the picker, in TMDB's display order (no override). Free means
# TMDB lists the service in France only as free or ad-supported. A variant is never listed: a
# player who picks the main service gets films on either. france.tv is an accepted gap.
[services.FR]
listed = [
  8,    # Netflix
  119,  # Amazon Prime Video
  350,  # Apple TV
  337,  # Disney Plus
  283,  # Crunchyroll
  381,  # Canal+
  2744, # INA madelen
  11,   # MUBI
  415,  # Animation Digital Network
  389,  # Sooner
  147,  # M6+
  1967, # Molotov TV
  685,  # Cine+ OCS Amazon Channel (the channel that matters in France)
  1754, # TF1+
  531,  # Paramount Plus
  193,  # SFR Play
  513,  # Shadowz
  1899, # HBO Max
]
free = [
  234,  # Arte
  538,  # Plex
  300,  # Pluto TV
  2077, # Plex Channel
]

[services.FR.variants]
1796 = 8     # Netflix Standard with Ads
2100 = 119   # Amazon Prime Video with Ads
2243 = 350   # Apple TV Amazon Channel
1968 = 283   # Crunchyroll Amazon Channel
1737 = 2744  # INA madelen Amazon Channel
201 = 11     # MUBI Amazon Channel
2173 = 415   # Anime Digital Network Amazon Channel
1736 = 513   # Shadowz Amazon Channel
