# flimme-api-production: the HTTP API's Fly.io app (Frankfurt). It is the only app that may hold
# the Supabase secret key, which is why it is separate from the workers
# (server-structure.md#deploying).
#
# Deployed by CI from server/ (.github/workflows/production.yml, after Harry approves). Harry
# creates the app and sets its secrets by hand: API_DATABASE_URL (the `flimme_http` login) and
# SUPABASE_URL, and optionally SENTRY_DSN. The deploy job skips with a warning until
# API_DATABASE_URL exists.
app = "flimme-api-production"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"

# The image's entrypoint is `server`, so the value is the command it runs.
[processes]
  api = "api --host 0.0.0.0 --port 8000"

# Health checks gate traffic: a machine whose database is unreachable gets none.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["api"]

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["api"]
