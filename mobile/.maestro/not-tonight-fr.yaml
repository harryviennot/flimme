# M6.70 in French: the simulator is set to fr_FR (xcrun simctl spawn <udid> defaults write -g
# AppleLanguages '("fr-FR")' and AppleLocale fr_FR), the app was already signed in on staging, and a
# curl host (a different room from not-tonight-b) has skipped Animation (genre id 16).
#   maestro --device <udid> test mobile/.maestro/not-tonight-fr.yaml -e METRO_URL=... -e CODE=<code>
appId: com.harryviennot.flimme.dev
---
- runFlow: subflows/open-app.yaml
- openLink: flimme-dev://join/${CODE}
- extendedWaitUntil:
    visible: 'Tes genres ce soir'
    timeout: 40000
- assertVisible: 'Tes envies'
- assertVisible: 'Pas ce soir'
- assertVisible: 'Animation, hors jeu ce soir'
- scrollUntilVisible:
    element: 'Écarter Horreur'
- tapOn: 'Écarter Horreur'
- assertVisible: 'Horreur, hors jeu ce soir'
- takeScreenshot: not-tonight-fr-1-step
- tapOn: 'Continuer'
- extendedWaitUntil:
    visible: 'Tes genres ce soir.*1 écarté.*'
    timeout: 20000
- takeScreenshot: not-tonight-fr-2-lobby
