# A fresh guest named Alice opens a room with four services and waits in the lobby with the
# invite sheet closed. Starts on the welcome screen.
appId: com.harryviennot.flimme.dev
---
- extendedWaitUntil:
    visible: '(?i)get started'
    timeout: 30000
- tapOn: '(?i)get started'
- inputText: 'Alice'
- tapOn: '(?i)continue'
- extendedWaitUntil:
    visible: '(?i)open a room'
    timeout: 15000
- tapOn: '(?i)open a room'
- extendedWaitUntil:
    visible: 'Netflix'
    timeout: 15000
- tapOn: 'Netflix'
- tapOn: 'Amazon Prime Video'
- tapOn: 'Disney Plus'
- tapOn: 'Canal\+'
- tapOn: '(?i)open the room'
- extendedWaitUntil:
    visible: '(?i)invite friends'
    timeout: 20000
# In a development build the floating dev tools button sits over the sheet's Close button.
- swipe:
    start: 91%,10%
    end: 50%,70%
- tapOn: '(?i)close'
- extendedWaitUntil:
    visible: '(?i)in the room'
    timeout: 15000
- takeScreenshot: swipe-host-lobby
