# Starts the app (keeping its data), connects the development build to Metro and closes the
# developer menu if it shows. `METRO_URL` comes from `-e METRO_URL=...` on the command line (default http://localhost:8094). Never set it in a flow's `env:` block: that overrides `-e`.
appId: com.harryviennot.flimme.dev
---
- launchApp:
    stopApp: true
- runFlow: connect-metro.yaml
