# M4.16, the early bot player: one phone hosts a room on staging and three bots (tools/bots)
# fill it. The lobby shows the three present players and Start swiping works.
# Needs Metro started with the staging environment (see the expo-app skill).
# The flow waits up to 3 minutes in the lobby for the bots, so start them once the room is open:
#   1. maestro test mobile/.maestro/bots-lobby.yaml -e METRO_URL=http://localhost:<port>
#   2. when the lobby shows, read the room code on the phone and run
#      FLIMME_STAGING_URL=... FLIMME_STAGING_KEY=... mise run bots -- --code <code> --target staging
appId: com.harryviennot.flimme.dev
---
- runFlow: subflows/open-app-fresh.yaml
- runFlow: subflows/use-staging.yaml
- runFlow: subflows/host-room.yaml
- takeScreenshot: bots-lobby-1-alone

# The bots join and stay present.
- extendedWaitUntil:
    visible: 'Bot 1.*'
    timeout: 180000
- extendedWaitUntil:
    visible: 'Bot 2.*'
    timeout: 30000
- extendedWaitUntil:
    visible: 'Bot 3.*'
    timeout: 30000
- assertNotVisible: '(?i)you need 2 players here to start.'
- takeScreenshot: bots-lobby-2-three-bots

# Start works: the room moves to swiping and the first card shows.
- tapOn: '(?i)start swiping'
- extendedWaitUntil:
    visible: 'Like'
    timeout: 60000
- takeScreenshot: bots-lobby-3-swiping
