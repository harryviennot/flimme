# Slice 7, the lobby: Home, Host, open the room (no share step), then the lobby shows the
# code, the own seat with the crown, and Start waiting for a second player. Leaving drops the
# phone on Home, and a relaunch stays on Home (the kept room is forgotten). Needs the local stack.
# Run: `maestro test mobile/.maestro/lobby.yaml -e METRO_URL=http://localhost:<port>`
# with the development build installed and Metro running.
appId: com.harryviennot.flimme.dev
---
- runFlow: subflows/open-app-fresh.yaml
- extendedWaitUntil:
    visible: '(?i)get started'
    timeout: 30000
- tapOn: '(?i)get started'
- inputText: 'Maestro'
- tapOn: '(?i)continue'
- extendedWaitUntil:
    visible: '(?i)open a room'
    timeout: 15000
- tapOn: '(?i)open a room'
- extendedWaitUntil:
    visible: 'Lumo'
    timeout: 15000
- tapOn: 'Lumo'
- tapOn: '(?i)open the room'
- extendedWaitUntil:
    visible: '(?i)in the room'
    timeout: 15000
- assertVisible: '(?i)maestro \(you\).*host.*'
- assertVisible: '(?i)nobody else yet.*'
- assertVisible: '(?i)you need 2 players here to start.'
- takeScreenshot: lobby-1-alone

# Leave: the alert, then Home. A relaunch stays on Home.
- tapOn: 'Back'
- assertVisible: '(?i)leave the room\?'
- tapOn: 'Leave'
- extendedWaitUntil:
    visible: '(?i)open a room'
    timeout: 15000
- runFlow: subflows/open-app.yaml
- extendedWaitUntil:
    visible: '(?i)open a room'
    timeout: 30000
- assertNotVisible: '(?i)in the room'
- takeScreenshot: lobby-2-home-after-relaunch
