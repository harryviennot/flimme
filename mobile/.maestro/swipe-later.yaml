# M6.51, M6.58, the bookmark (a solo like): run on a phone in a swiping room (solo is the simplest), after the first card shows.
# The bookmark saves from the front, the card stays and can still be swiped; it saves from the back;
# the film shows under My films, Liked, Solo chip; there is no Later segment. Needs staging (set_film_saved).
# Run: `maestro --device <sim> test mobile/.maestro/swipe-later.yaml`
appId: com.harryviennot.flimme.dev
---
- extendedWaitUntil:
    visible: 'Seen it'
    timeout: 90000
- takeScreenshot: later-1-front-empty
- assertVisible: 'Add to your likes'
# Saving is not an answer: the card stays, the bookmark fills.
- tapOn: 'Add to your likes'
- assertVisible: 'Remove from your likes'
- takeScreenshot: later-2-front-saved
# A second tap takes it back, and a third saves again.
- tapOn: 'Remove from your likes'
- assertVisible: 'Add to your likes'
- tapOn: 'Add to your likes'
- assertVisible: 'Remove from your likes'
# The card is still there to swipe, and a tap elsewhere on it still flips it.
- tapOn:
    point: 50%,60%
- extendedWaitUntil:
    visible: 'Synopsis'
    timeout: 5000
- takeScreenshot: later-3-back-saved
# The back has its own bookmark in the same state, at the same spot (bottom right). Tapped by
# point: the turned-away front's bookmark is in the tree too, so a label would find it first.
- tapOn:
    point: 87%,90%
- takeScreenshot: later-4-back-removed
- tapOn:
    point: 87%,90%
- takeScreenshot: later-5-back-saved-again
- tapOn:
    point: 50%,60%
- assertVisible: 'Remove from your likes'
# Swipe the saved card away: the answer is a normal one.
- tapOn: 'Nope'
- waitForAnimationToEnd
