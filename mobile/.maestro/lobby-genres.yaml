# M6.54, per-player genres in the lobby: one phone hosts a room on staging, a bot picks genres,
# the host picks up to 3 and sees the 4th-pick note, the counts show on the chips (never names),
# and Start works. Needs Metro started with the staging environment (see the expo-app skill) and
# M6.53 on staging.
#   1. maestro test mobile/.maestro/lobby-genres.yaml -e METRO_URL=http://localhost:<port>
#   2. when the lobby shows, read the room code and run
#      FLIMME_STAGING_URL=... FLIMME_STAGING_KEY=... mise run bots -- --code <code> --target staging \
#        --count 1 --swipe-ms off --genres 35,27 --leave-on-stop yes
# 35 is Comedy and 27 is Horror (TMDB). The bot leaves the room when stopped (Ctrl-C).
appId: com.harryviennot.flimme.dev
---
- runFlow: subflows/open-app-fresh.yaml
- runFlow: subflows/use-staging.yaml
- runFlow: subflows/host-room.yaml

# The row is there, optional, with nothing picked.
- scrollUntilVisible:
    element: 'Your genres tonight.*'
- assertVisible: 'Your genres tonight, Optional'
- extendedWaitUntil:
    visible: 'Bot 1.*'
    timeout: 180000

# The sheet: counts on the chips, no names anywhere.
- tapOn: 'Your genres tonight.*'
- extendedWaitUntil:
    visible: 'Comedy, 1 player'
    timeout: 20000
- assertVisible: 'Horror, 1 player'
- takeScreenshot: lobby-genres-1-sheet

# Up to 3, then a gentle note for the 4th.
- tapOn: 'Comedy.*'
- tapOn: 'Horror.*'
- tapOn: 'Thriller.*'
- assertNotVisible: '3 genres at most.*'
- tapOn: 'Western.*'
- assertVisible: '3 genres at most.*'
- takeScreenshot: lobby-genres-2-cap
- tapOn: 'Thriller.*'
- tapOn: 'Done'

# The row names the picks, and Start still works.
- extendedWaitUntil:
    visible: 'Your genres tonight.*Comedy.*'
    timeout: 15000
- takeScreenshot: lobby-genres-3-row
- tapOn: '(?i)start swiping'
- extendedWaitUntil:
    visible: 'Like'
    timeout: 60000
