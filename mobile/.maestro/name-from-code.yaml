# Slices 4 and 6, a code that needs a name: Welcome's "I have a room code", the code of an open
# room, the name screen, and back on the code screen, which joins by itself once the profile has
# a name (the room's lobby, a placeholder until M4.11). Saving the name never goes to Home.
# Needs the local stack: seed the open room first with
#   mobile/.maestro/scripts/seed-open-room.sh      (a room with the code 482913)
# Run: `maestro test mobile/.maestro/name-from-code.yaml -e METRO_URL=http://localhost:<port>`
# with the development build installed and Metro running.
appId: com.harryviennot.flimme.dev
---
- runFlow: subflows/open-app-fresh.yaml
- extendedWaitUntil:
    visible: '(?i)get started'
    timeout: 30000

- tapOn: '(?i)i have a room code'
- extendedWaitUntil:
    visible: '(?i)enter the room code'
    timeout: 15000
- inputText: '482913'

# The profile has no name: the code screen sends the player to the name screen.
- extendedWaitUntil:
    visible: '(?i)what should we call you\?'
    timeout: 15000
- assertVisible: '(?i)your color'
- takeScreenshot: name-from-code-1-name

- inputText: 'Coco'
- tapOn: '(?i)continue'

# Back from the name screen: the profile is saved, the code screen joins by itself, and we
# never see Home.
- extendedWaitUntil:
    visible: '(?i)lobby'
    timeout: 20000
- assertNotVisible: '(?i)open a room'
- takeScreenshot: name-from-code-2-in-the-room

# The name was saved: a relaunch lands on Home.
- runFlow: subflows/open-app.yaml
- extendedWaitUntil:
    visible: '(?i)open a room'
    timeout: 30000
- assertNotVisible: '(?i)get started'
