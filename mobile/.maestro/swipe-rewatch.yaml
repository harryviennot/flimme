# M6.49, the rewatch chip: run on the host's phone in an `allow_rewatch` room (a Quick Match room
# is one) with a second player in it, after "Start swiping". One tap on Seen it (or a swipe up)
# sends `seen` and the card flies up; a chip then offers Yes. A fast double tap never adds a like,
# Yes shows "Up for a rewatch", and the chip leaves after 5 seconds or at the next answer.
# Run: `maestro --device <sim> test mobile/.maestro/swipe-rewatch.yaml`
appId: com.harryviennot.flimme.dev
---
- extendedWaitUntil:
    visible: 'Seen it'
    timeout: 90000
- takeScreenshot: rewatch-1-first-card
- waitForAnimationToEnd

# A swipe up behaves like the tap: the card flies, the chip shows.
- swipe:
    start: 50%,50%
    end: 50%,20%
    duration: 300
- assertVisible: 'Seen it. Watch it again tonight?'
- takeScreenshot: rewatch-2-chip-after-swipe

# The chip leaves after 5 seconds.
- extendedWaitUntil:
    notVisible: 'Seen it. Watch it again tonight?'
    timeout: 8000

# A fast double tap on Seen it answers two cards as seen. No like, the chip belongs to the latest.
- tapOn:
    text: 'Seen it'
    repeat: 2
    delay: 50
- assertVisible: 'Seen it. Watch it again tonight?'
- takeScreenshot: rewatch-3-after-double-tap

# The next answer takes the chip away.
- tapOn: 'Nope'
- assertNotVisible: 'Seen it. Watch it again tonight?'

# Yes turns the answer into a like and confirms.
- tapOn: 'Seen it'
- assertVisible: 'Seen it. Watch it again tonight?'
- tapOn: 'Yes, watch it again tonight'
- assertVisible: 'Up for a rewatch'
- takeScreenshot: rewatch-4-confirmation
- extendedWaitUntil:
    notVisible: 'Up for a rewatch'
    timeout: 3000
