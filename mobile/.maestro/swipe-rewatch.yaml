# M6.12, "Watch it again tonight?": run on the host's phone in an `allow_rewatch` room (a Quick
# Match room is one) with a second player in it, after "Start swiping". Swipe up asks the
# question; a drag back down, a tap on the card and a tap outside the answers all close it with
# no vote; going to the background and back keeps it open; a double tap on Yes answers once.
# Run: `maestro --device <sim> test mobile/.maestro/swipe-rewatch.yaml`
appId: com.harryviennot.flimme.dev
---
- extendedWaitUntil:
    visible: 'Seen it'
    timeout: 90000
- takeScreenshot: rewatch-1-first-card
- waitForAnimationToEnd

# A swipe up asks.
- swipe:
    start: 50%,50%
    end: 50%,20%
    duration: 300
- assertVisible: 'Watch it again tonight?'
- takeScreenshot: rewatch-2-question

# A drag back down closes it with no vote (the same card is still on top).
- swipe:
    start: 50%,50%
    end: 50%,75%
    duration: 300
- assertNotVisible: 'Watch it again tonight?'
- assertVisible: 'Seen it'
- takeScreenshot: rewatch-3-dragged-back

# The eye button asks too; a tap outside the answers closes it.
- tapOn: 'Seen it'
- assertVisible: 'Watch it again tonight?'
- tapOn:
    point: 50%,8%
- assertNotVisible: 'Watch it again tonight?'

# A tap on the card closes it.
- tapOn: 'Seen it'
- assertVisible: 'Watch it again tonight?'
- tapOn:
    point: 50%,30%
- assertNotVisible: 'Watch it again tonight?'
- assertVisible: 'Seen it'

# Background and foreground: the question stays open.
- tapOn: 'Seen it'
- assertVisible: 'Watch it again tonight?'
- pressKey: home
- launchApp:
    stopApp: false
- assertVisible: 'Watch it again tonight?'
- takeScreenshot: rewatch-4-after-background

# A double tap on Yes answers once.
- tapOn:
    text: 'Yes, watch it again tonight'
    repeat: 2
    delay: 50
- assertNotVisible: 'Watch it again tonight?'
- assertVisible: 'Seen it'
- takeScreenshot: rewatch-5-after-double-yes
