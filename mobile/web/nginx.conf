# The invite page and the app-link files on flimme.com (roadmap M4.18), in the web image
# (mobile/web.Dockerfile). Dokploy's Traefik on the VPS does TLS and sends flimme.com,
# www.flimme.com, flimme.fr and www.flimme.fr here on port 80; the redirects are this file's
# (Q18.2, Q18.8). CI's `web` job builds the image and checks it with
# tools/check-well-known.mjs. The whole config is here, so nothing from the image's defaults logs.

user nginx;
worker_processes auto;
pid /run/nginx.pid;
# A request error names the client's address and the path, which holds a room id (CLAUDE.md
# rule 7), so only critical errors are logged. Startup errors still show.
error_log /dev/stderr crit;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # No access log: invite paths carry room ids and requests carry client addresses (rule 7).
  access_log off;
  log_not_found off;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  # A redirect nginx makes itself stays relative: Traefik in front knows the scheme and host.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The page. default_server, so any other host (Dokploy's test domain) gets the page too.
  server {
    listen 80 default_server;
    server_name flimme.com;
    root /usr/share/nginx/html;

    # The files iOS and Android fetch to verify the app's claim on the domain: 200 as JSON, never
    # a redirect (decisions.md, Q14.2). The Apple file has no extension, hence the explicit type.
    location = /.well-known/apple-app-site-association {
      types { }
      default_type application/json;
      try_files $uri =404;
    }
    location = /.well-known/assetlinks.json {
      types { }
      default_type application/json;
      try_files $uri =404;
    }

    # Bundles named after their content: kept for a year. A missing one is a 404, never the page.
    location /_expo/static/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # The single-page export: a path that isn't a file gets index.html, which draws the invite for
    # /join/<code> and the broken-link state for anything else (decisions.md, Q14.7). No $uri/,
    # which would add directory redirects.
    location / {
      try_files $uri /index.html;
    }

    # Checked again on every visit, so a deploy shows at once.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }
  }

  # The other names, path and query kept. Traefik answers the Let's Encrypt challenges itself, so
  # they never reach these blocks. www goes to the bare domain for good (Q18.2).
  server {
    listen 80;
    server_name www.flimme.com;
    return 301 https://flimme.com$request_uri;
  }
  server {
    listen 80;
    server_name www.flimme.fr;
    return 301 https://flimme.fr$request_uri;
  }

  # flimme.fr will be the French site and flimme.com the English one (Q18.8). Invite links live on
  # flimme.com, so they go there for good. The rest goes there only until the French site exists:
  # browsers keep a 301 for good, and it would hide the French site.
  server {
    listen 80;
    server_name flimme.fr;
    location /join/ {
      return 301 https://flimme.com$request_uri;
    }
    location / {
      return 302 https://flimme.com$request_uri;
    }
  }
}
