<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Flimme</title>
    <!-- The link preview (iMessage, WhatsApp and others read these tags without running
         JavaScript). Both languages, since a preview is made once for every reader. Neither names
         the host. The page sets its own title and description for the language it shows. -->
    <meta name="description" content="On t'invite à choisir le film du soir · You're invited to pick tonight's movie" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flimme" />
    <meta property="og:title" content="Flimme" />
    <meta property="og:description" content="On t'invite à choisir le film du soir · You're invited to pick tonight's movie" />
    <meta name="theme-color" content="#0f1014" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0f1014;
      }
      /* The invite page scrolls inside its own ScrollView. */
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
